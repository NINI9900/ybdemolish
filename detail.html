<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시공 상세 · 청년철거</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --blue: #1B6CF7; --gray-bg: #f2f3f5; --muted: #888; }
    html, body { font-family: "Noto Sans KR", sans-serif; background: var(--gray-bg); color: #111; }

    /* NAV */
    .gnav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 500;
      height: 72px; background: transparent;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 40px; transition: background 0.3s;
    }
    .gnav.scrolled { background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); box-shadow: 0 1px 12px rgba(0,0,0,0.08); }
    .gnav-logo img { height: 26px; display: block; }
    .gnav-links { display: flex; gap: 40px; }
    .gnav-links a { font-size: 15px; font-weight: 500; color: rgba(255,255,255,0.9); text-decoration: none; transition: color 0.2s; }
    .gnav.scrolled .gnav-links a { color: #333; }
    .gnav-links a:hover { color: #fff; }
    .gnav.scrolled .gnav-links a:hover { color: var(--blue); }
    .gnav-hamburger { display: none; }
    .gnav-drawer { display: none; }

    /* HERO SECTION */
    .detail-hero {
      background: var(--gray-bg);
      padding: 120px 40px 56px;
      text-align: center;
    }
    .detail-hero .eyebrow {
      font-size: 13px; font-weight: 700; letter-spacing: 0.12em;
      color: var(--blue); text-transform: uppercase;
      margin-bottom: 18px; display: block;
    }
    .detail-hero h1 {
      font-size: 52px; font-weight: 900; color: #111;
      letter-spacing: -0.04em; line-height: 1.15;
    }

    /* HERO IMAGES */
    .hero-imgs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
    }
    .hero-imgs .hi {
      aspect-ratio: 4/3;
      overflow: hidden;
      background: #ddd;
    }
    .hero-imgs .hi img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      transition: transform 0.5s;
    }
    .hero-imgs .hi:hover img { transform: scale(1.04); }

    /* MAIN CONTENT */
    .detail-body {
      max-width: 1200px; margin: 0 auto;
      padding: 48px 40px 0;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 32px;
      align-items: start;
    }

    /* LEFT: info card + table */
    .detail-left {}

    .detail-info-card {
      background: #fff;
      border-radius: 20px;
      padding: 32px 36px;
      margin-bottom: 24px;
    }
    .detail-label {
      display: flex; align-items: center; gap: 8px;
      font-size: 20px; font-weight: 700; color: var(--blue);
      margin-bottom: 14px;
    }
    .detail-label img { height: 28px; width: auto; }
    .detail-title {
      font-size: 38px; font-weight: 900;
      letter-spacing: -0.04em; line-height: 1.2;
      margin-bottom: 10px; color: #111;
      word-break: keep-all;
    }
    .detail-region { font-size: 20px; color: var(--muted); }

    /* TABLE */
    .detail-table-wrap {
      background: transparent;
    }
    .detail-table-title {
      font-size: 20px; font-weight: 800;
      padding: 0 0 16px;
    }
    .detail-table {
      width: 100%; border-collapse: separate; border-spacing: 10px 10px;
    }
    .detail-table td.td-cell {
      background: transparent;
      border: 1px solid #d0d0d0;
      border-radius: 14px;
      padding: 16px 20px;
      width: 50%;
    }
    .td-cell .cell-label {
      font-size: 20px; color: var(--muted); font-weight: 700;
      display: block; margin-bottom: 12px;
    }
    .td-cell .cell-value {
      font-size: 20px; font-weight: 700; color: #111;
      display: block; text-align: right;
    }

    /* RIGHT: 철거정보 card */
    .detail-right {}
    .detail-right-card {
      background: transparent;
      border: 1px solid #d0d0d0;
      border-radius: 20px;
      padding: 28px 28px 24px;
      position: sticky;
      top: 92px;
    }
    .right-card-title {
      font-size: 20px; font-weight: 700;
      color: #111; margin-bottom: 20px;
    }
    .right-info-row {
      display: flex; justify-content: space-between;
      align-items: center; padding: 11px 0;
      font-size: 20px;
    }

    .right-info-row .rl { color: var(--muted); font-weight: 700; }
    .right-info-row .rv { font-weight: 700; color: #111; }
    .detail-btns { margin-top: 22px; display: flex; flex-direction: column; gap: 10px; }
    .btn-primary {
      display: block; text-align: center; padding: 15px 20px;
      border-radius: 999px; background: var(--blue); color: #fff;
      font-size: 15px; font-weight: 700; text-decoration: none;
      transition: opacity 0.2s;
    }
    .btn-primary:hover { opacity: 0.85; }
    .btn-secondary {
      display: block; text-align: center; padding: 14px 20px;
      border-radius: 999px; border: 1.5px solid #ddd; background: #fff;
      color: #111; font-size: 15px; font-weight: 500;
      text-decoration: none; cursor: pointer; transition: all 0.2s;
      font-family: inherit;
    }
    .btn-secondary:hover { border-color: var(--blue); color: var(--blue); }

    /* GALLERY */
    .detail-gallery {
      max-width: 1200px; margin: 32px auto 0;
      padding: 0 40px;
    }
    .gallery-title {
      font-size: 20px; font-weight: 800;
      color: #111; margin-bottom: 16px; padding: 0 4px;
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .gallery-item {
      aspect-ratio: 4/3; overflow: hidden;
      border-radius: 12px; background: #ddd;
      cursor: pointer;
    }
    .gallery-item img {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform 0.4s; display: block;
    }
    .gallery-item:hover img { transform: scale(1.05); }

    /* LIGHTBOX */
    .lightbox {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.95); z-index: 2000;
      flex-direction: column; align-items: center; justify-content: center;
    }
    .lightbox.open { display: flex; }
    .lb-main {
      position: relative; display: flex; align-items: center; justify-content: center;
      width: 100%; flex: 1; padding: 60px 48px;
    }
    .lb-main img {
      max-width: 100%; max-height: 80vh;
      width: 100%;
      object-fit: contain; border-radius: 8px;
      display: block;
    }
    .lightbox-close {
      position: fixed; top: 20px; right: 24px;
      font-size: 36px; color: #fff; cursor: pointer;
      background: none; border: none; line-height: 1; z-index: 10;
    }
    .lb-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,0.15); border: none; color: #fff;
      width: 48px; height: 48px; border-radius: 50%;
      font-size: 22px; cursor: pointer; display: flex;
      align-items: center; justify-content: center;
      transition: background 0.2s; backdrop-filter: blur(4px);
    }
    .lb-nav:hover { background: rgba(255,255,255,0.3); }
    .lb-prev { left: 20px; }
    .lb-next { right: 20px; }
    .lb-nav:disabled { opacity: 0.3; cursor: default; }
    /* 썸네일 */
    .lb-thumbs {
      display: flex; gap: 8px; padding: 12px 20px 20px;
      overflow-x: auto; max-width: 100%;
      scrollbar-width: none;
    }
    .lb-thumbs::-webkit-scrollbar { display: none; }
    .lb-thumb {
      width: 64px; height: 48px; flex-shrink: 0;
      border-radius: 6px; overflow: hidden; cursor: pointer;
      border: 2px solid transparent; opacity: 0.6;
      transition: all 0.2s;
    }
    .lb-thumb.active { border-color: #fff; opacity: 1; }
    .lb-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    /* 카운터 */
    .lb-counter {
      position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
      color: rgba(255,255,255,0.7); font-size: 14px; font-weight: 500;
    }

    /* CTA */
    .detail-cta {
      background: var(--blue);
      padding: 80px 40px; text-align: center; margin-top: 64px;
    }
    .detail-cta h2 { font-size: 40px; font-weight: 900; color: #fff; letter-spacing: -0.04em; line-height: 1.25; margin-bottom: 14px; }
    .detail-cta p { font-size: 16px; color: rgba(255,255,255,0.88); line-height: 1.7; margin-bottom: 32px; }
    .btn-white {
      display: inline-block; padding: 16px 40px;
      background: #fff; color: var(--blue); border-radius: 999px;
      font-size: 16px; font-weight: 700; text-decoration: none; transition: opacity 0.2s;
    }
    .btn-white:hover { opacity: 0.9; }

    /* FOOTER */
    .ybfooter { background: #111; padding: 60px 40px; border-top: 1px solid rgba(255,255,255,0.07); }
    .ybfooter-inner { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 200px 1fr 1fr; gap: 48px; }
    .ybfooter-logo { font-size: 22px; font-weight: 900; color: #fff; }
    .ybfooter-info p, .ybfooter-info02 p { font-size: 14px; color: #888; line-height: 1.8; margin-bottom: 4px; }
    .ybfooter-info p strong, .ybfooter-info02 p strong { color: rgba(255,255,255,0.7); font-weight: 500; margin-right: 6px; }
    .ybfooter-info a, .ybfooter-info02 a { color: #888; text-decoration: none; }
    .ybfooter-info02 .copyright { font-size: 12px; color: #555; margin-top: 8px; }

    /* MOBILE */
    @media (max-width: 768px) {
      .gnav { padding: 0 20px; height: 60px; }
      .gnav.scrolled { background: rgba(0,0,0,0.88); }
      .gnav.scrolled .gnav-links a { color: rgba(255,255,255,0.85); }
      .gnav-links { display: none !important; }
      .gnav-hamburger {
        display: flex; flex-direction: column; justify-content: space-between;
        width: 28px; height: 20px; background: none; border: none; cursor: pointer; padding: 0; z-index: 1001;
      }
      .gnav-hamburger span { display: block; width: 100%; height: 2px; background: #fff; border-radius: 2px; transition: all 0.3s; }
      .gnav-hamburger.open span:nth-child(1) { transform: translateY(9px) rotate(45deg); }
      .gnav-hamburger.open span:nth-child(2) { opacity: 0; }
      .gnav-hamburger.open span:nth-child(3) { transform: translateY(-9px) rotate(-45deg); }
      .gnav-drawer { position: fixed; top: 60px; left: 0; right: 0; background: rgba(0,0,0,0.45); flex-direction: column; padding: 24px 28px; z-index: 999; align-items: flex-end; border-top: 1px solid rgba(255,255,255,0.08); }
      .gnav-drawer.open { display: flex !important; }
      .gnav-drawer a { display: block; color: rgba(255,255,255,0.85); font-size: 18px; font-weight: 500; padding: 16px 0; border-bottom: 1px solid rgba(255,255,255,0.07); text-decoration: none; text-align: right; width: 100%; }
      .gnav-drawer a:last-child { border-bottom: none; }

      .detail-hero { padding: 90px 20px 36px; }
      .detail-hero h1 { font-size: 28px; }
      .hero-imgs { grid-template-columns: 1fr 1fr; }
      .hero-imgs .hi:nth-child(3) { display: none; }

      .detail-body { grid-template-columns: 1fr; padding: 24px 16px 0; gap: 16px; }
      .detail-info-card { padding: 24px 20px; border-radius: 16px; }
      .detail-title { font-size: 24px; }
      .detail-right-card { position: static; border-radius: 16px; padding: 16px !important; }
      .right-card-title { font-size: 16px !important; margin-bottom: 12px !important; }
      .right-info-row { font-size: 16px !important; padding: 8px 0 !important; }
      .detail-btns { margin-top: 14px !important; gap: 8px !important; }
      .btn-primary, .btn-secondary { padding: 12px 16px !important; font-size: 14px !important; }
      .lb-main { padding: 50px 16px; }
      .lb-nav { width: 40px; height: 40px; font-size: 20px; }
      .lb-thumb { width: 56px; height: 42px; }
      .detail-table td.td-cell { padding: 10px 14px !important; }
      .td-cell .cell-label { font-size: 14px !important; margin-bottom: 8px !important; }
      .td-cell .cell-value { font-size: 16px !important; }
      .detail-table { border-spacing: 6px 6px !important; }
      .detail-gallery { padding: 0 16px; margin-top: 20px; }
      .gallery-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .gallery-item { aspect-ratio: 3/2; border-radius: 10px; }
      .detail-cta { padding: 56px 20px; margin-top: 40px; }
      .detail-cta h2 { font-size: 26px; }
      .ybfooter { padding: 40px 20px; }
      .ybfooter-inner { grid-template-columns: 1fr; gap: 24px; }

      /* 로딩 스피너 색상 */
      .spinner { border-color: #ddd; border-top-color: var(--blue); }
    }
  </style>
</head>
<body>

<nav class="gnav" id="gnav">
  <div class="gnav-logo">
    <a href="index.html"><img src="assets/images/img_3.png" alt="청년철거"></a>

  <div class="gnav-links">

  </div>
  <button class="gnav-hamburger" id="gnavHamburger"><span></span><span></span><span></span></button>

<div id="pageContent">
  <div style="display:flex;align-items:center;justify-content:center;height:80vh;flex-direction:column;gap:16px;">
    <div style="width:40px;height:40px;border:3px solid #ddd;border-top-color:#1B6CF7;border-radius:50%;animation:spin 0.8s linear infinite;"></div>

<div class="lightbox" id="lightbox">

  <div class="lb-main">
    <button class="lb-nav lb-prev" id="lbPrev">&#8249;</button>
    <img id="lbImg" src="" alt="">
    <button class="lb-nav lb-next" id="lbNext">&#8250;</button>
  </div>
  <div class="lb-thumbs" id="lbThumbs"></div>
</div>

<footer class="ybfooter">
  <div class="ybfooter-inner">
    <div class="ybfooter-logo">청년철거</div>
    <div class="ybfooter-info">
      <p><strong>전화 번호:</strong>1866-0379</p>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwZkOmLSIertg7CaImERwnxXlqobBjeDeoTOjfK6MS_BD4gse3pr-L_Y73rbc27huNR/exec';

function driveImg(url, size) {
  if (!url) return '';
  const m = url.match(/[-\w]{25,}/);
  if (!m) return url;
  return `https://drive.google.com/thumbnail?id=${m[0]}&sz=w${size || 800}`;
}

function getParam(key) {
  return new URLSearchParams(window.location.search).get(key);
}

async function loadDetail() {
  const id = parseInt(getParam('id'));
  const content = document.getElementById('pageContent');

  try {
    const res = await fetch(API_URL);
    const data = await res.json();
    const item = data.find(d => d.id === id) || data[0];
    if (!item) throw new Error('not found');

    document.title = `${item.name} · 청년철거`;

    // Hero images (img1~3) — 부족하면 thumb/img4~10으로 채움
    const allImgs = [item.img1,item.img2,item.img3,item.img4,item.img5,item.img6,item.img7,item.img8,item.img9,item.img10,item.thumb].filter(Boolean);
    const heroSrcs = [0,1,2].map(i => allImgs[i] || allImgs[0] || '');
    const heroHTML = heroSrcs.map(u => u
      ? `<div class="hi"><img src="${driveImg(u,1200)}" alt="${item.name}" loading="lazy"></div>`
      : '<div class="hi"></div>'
    ).join('');

    // Gallery (사례이미지 + 1~10 상세이미지 전부)
    // Gallery (사례이미지 + 1~10 상세이미지, 아이콘 제외)
    // URL trim + 완전 URL 기준 중복 제거
    const seenUrls = new Set();
    const gallerySrcs = [item.thumb,item.img1,item.img2,item.img3,item.img4,item.img5,item.img6,item.img7,item.img8,item.img9,item.img10]
      .map(u => u ? u.trim() : '')
      .filter(u => {
        if (!u) return false;
        if (seenUrls.has(u)) return false;
        seenUrls.add(u);
        return true;
      });
    const galleryFullUrls = gallerySrcs.map(u => driveImg(u, 1400));
    // 전역에 이미지 목록 등록
    lbImages = galleryFullUrls;

    const galleryHTML = gallerySrcs.map((u,i) =>
      `<div class="gallery-item" onclick="openLightbox('${driveImg(u,1400)}')">
        <img src="${driveImg(u,600)}" alt="시공사진 ${i+4}" loading="lazy">
      </div>`
    ).join('');

    // Table
    const sizeVal = item.size ? (item.size.includes('평') ? item.size : item.size+'평') : '-';
    const tableRows = [
      ['철거유형', item.category||'-', '건물평수', sizeVal],
      ['건물유형', item.type||'-',     '철거지원금', item.subsidy||'-'],
    ];
    const tableHTML = tableRows.map(([l1,v1,l2,v2]) => `
      <tr>
        <td class="td-cell"><span class="cell-label">${l1}</span><span class="cell-value">${v1}</span></td>
        <td class="td-cell"><span class="cell-label">${l2}</span><span class="cell-value">${v2}</span></td>
      </tr>`).join('');

    content.innerHTML = `
      <section class="detail-hero">
        <span class="eyebrow">REPORT</span>
        <h1>청년철거 현장 보고서</h1>
      </section>

      <div class="hero-imgs">${heroHTML}</div>

      <div class="detail-body">
        <div class="detail-left">
          <div class="detail-info-card">
            <div class="detail-label">
              ${item.icon ? `<img src="${driveImg(item.icon,60)}" alt="">` : ''}
              ${[item.category, item.size ? (item.size.includes('평') ? item.size : item.size+'평') : ''].filter(Boolean).join(' · ')}
            </div>
            <h2 class="detail-title">${item.name}</h2>
            <p class="detail-region">${item.region}</p>
          </div>
          <div class="detail-table-wrap">
            <h3 class="detail-table-title">현장 정보</h3>
            <table class="detail-table"><tbody>${tableHTML}</tbody></table>
          </div>
        </div>

        <div class="detail-right">
          <div class="detail-right-card">
            <p class="right-card-title">철거 정보</p>
            ${item.date ? `<div class="right-info-row"><span class="rl">시공 일자</span><span class="rv">${item.date}</span></div>` : ''}
            ${item.period ? `<div class="right-info-row"><span class="rl">작업 기간</span><span class="rv">${item.period}</span></div>` : ''}
            <div class="detail-btns">
              <a href="https://ybdemolish.imweb.me/Quotationinquiry" class="btn-primary" target="_blank">무료 견적 받으러가기</a>
              <a href="sub-page.html" class="btn-secondary">목록으로 가기</a>
            </div>
          </div>
        </div>
      </div>

      ${galleryHTML ? `
      <div class="detail-gallery">
        <h3 class="gallery-title">시공 사진</h3>
        <div class="gallery-grid">${galleryHTML}</div>
      </div>` : ''}

      <section class="detail-cta">
        <h2>새로운 시작을 함께, 청년철거</h2>
        <p>철거는 끝이 아니라, 다음을 위한 준비입니다.<br>우리는 그 준비를 기준과 책임으로 진행합니다.</p>
        <a href="https://ybdemolish.imweb.me/Quotationinquiry" class="btn-white" target="_blank">무료 견적 요청 &gt;</a>
      </section>
    `;
  } catch(e) {
    content.innerHTML = `<div style="text-align:center;padding:120px 20px;color:#888;">데이터를 불러오지 못했습니다.</div>`;
  }
}

let lbImages = [];
let lbIndex = 0;

function openLightbox(src) {
  lbIndex = lbImages.indexOf(src);
  if (lbIndex < 0) lbIndex = 0;
  renderLightbox();
  document.getElementById('lightbox').classList.add('open');
}

function renderLightbox() {
  const img = document.getElementById('lbImg');
  const counter = document.getElementById('lbCounter');
  const thumbs = document.getElementById('lbThumbs');
  const prev = document.getElementById('lbPrev');
  const next = document.getElementById('lbNext');

  img.src = lbImages[lbIndex];
  counter.textContent = `${lbIndex + 1} / ${lbImages.length}`;
  prev.disabled = lbIndex === 0;
  next.disabled = lbIndex === lbImages.length - 1;

  thumbs.innerHTML = lbImages.map((u, i) =>
    `<div class="lb-thumb${i === lbIndex ? ' active' : ''}" onclick="lbGo(${i})">
      <img src="${u.replace('sz=w1400','sz=w200')}" loading="lazy">
    </div>`
  ).join('');

  // 활성 썸네일 스크롤
  const activeThumb = thumbs.querySelectorAll('.lb-thumb')[lbIndex];
  if (activeThumb) activeThumb.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
}

function lbGo(i) {
  lbIndex = i;
  renderLightbox();
}

document.getElementById('lbPrev').addEventListener('click', () => { if (lbIndex > 0) { lbIndex--; renderLightbox(); } });
document.getElementById('lbNext').addEventListener('click', () => { if (lbIndex < lbImages.length - 1) { lbIndex++; renderLightbox(); } });

// 키보드
document.addEventListener('keydown', e => {
  if (!document.getElementById('lightbox').classList.contains('open')) return;
  if (e.key === 'ArrowLeft' && lbIndex > 0) { lbIndex--; renderLightbox(); }
  if (e.key === 'ArrowRight' && lbIndex < lbImages.length - 1) { lbIndex++; renderLightbox(); }
  if (e.key === 'Escape') document.getElementById('lightbox').classList.remove('open');
});

document.getElementById('lbClose').addEventListener('click', () => {
  document.getElementById('lightbox').classList.remove('open');
});
document.getElementById('lightbox').addEventListener('click', e => {
  if (e.target === e.currentTarget || e.target.classList.contains('lb-main'))
    document.getElementById('lightbox').classList.remove('open');
});

// NAV
const gnav = document.getElementById('gnav');
window.addEventListener('scroll', () => {
  gnav.classList.toggle('scrolled', window.scrollY > 60);
}, { passive: true });
const hbtn = document.getElementById('gnavHamburger');
const hdrawer = document.getElementById('gnavDrawer');
hbtn.addEventListener('click', () => { hbtn.classList.toggle('open'); hdrawer.classList.toggle('open'); });
hdrawer.querySelectorAll('a').forEach(a => a.addEventListener('click', () => { hbtn.classList.remove('open'); hdrawer.classList.remove('open'); }));

loadDetail();
</script>
